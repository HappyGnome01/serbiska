<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f3e9db">
  <!-- Gör att appen ser ut som en app när den läggs på hemskärmen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Serbiska">
  <!-- Ikonen på hemskärmen och i webbläsarens flik. Ritas av tools/make-icon.ps1 -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="apple-touch-icon.png">
  <title>Serbiska</title>
  <!-- Valt ljust eller mörkt läge sätts innan sidan ritas, så att färgerna inte blinkar -->
  <script>try { const t = localStorage.getItem("serbiska-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1><button id="themeBtn" class="title-btn" aria-label="Serbiska. Välj ljust eller mörkt läge.">Serbiska</button></h1>
    <div class="header-stats">
      <button id="lessonCount" aria-label="Din lektion. Visa på stigen."></button>
      <button id="streakCount" aria-label="Dagar i rad. Visa mer."></button>
      <button id="knownCount" aria-label="Ord du kan, Lätt och Bra. Visa mer."></button>
      <button id="spelledCount" aria-label="Ord du kan stava. Visa mer."></button>
    </div>
  </header>

  <!-- Allt innehåll ritas här av app.js -->
  <main id="main"><p class="muted center">Laddar…</p></main>

  <!-- Ljus och skugga som gör att ringarna ser ut som runda rör -->
  <svg class="ring-defs" width="0" height="0" aria-hidden="true">
    <defs>
      <radialGradient id="ringShine" gradientUnits="userSpaceOnUse" cx="50" cy="50" r="47">
        <stop offset="0.787" stop-color="#000" stop-opacity="0.22"/>
        <stop offset="0.87" stop-color="#fff" stop-opacity="0.5"/>
        <stop offset="0.93" stop-color="#fff" stop-opacity="0.05"/>
        <stop offset="1" stop-color="#000" stop-opacity="0.25"/>
      </radialGradient>
      <radialGradient id="ringDent" gradientUnits="userSpaceOnUse" cx="50" cy="50" r="47">
        <stop offset="0.787" stop-color="#000" stop-opacity="0.14"/>
        <stop offset="0.87" stop-color="#fff" style="stop-opacity: var(--tube)"/>
        <stop offset="0.93" stop-color="#fff" style="stop-opacity: var(--tube-soft)"/>
        <stop offset="1" stop-color="#000" stop-opacity="0.14"/>
      </radialGradient>
      <!-- Bock och kryss: ljus ovanifrån, mörkare nertill, som blank plast -->
      <linearGradient id="markOk" gradientUnits="userSpaceOnUse" x1="0" y1="3" x2="0" y2="21">
        <stop offset="0" stop-color="#7fdc5f"/>
        <stop offset="0.55" stop-color="#4cb83a"/>
        <stop offset="1" stop-color="#2f9128"/>
      </linearGradient>
      <linearGradient id="markBad" gradientUnits="userSpaceOnUse" x1="0" y1="3" x2="0" y2="21">
        <stop offset="0" stop-color="#f26a62"/>
        <stop offset="0.55" stop-color="#dc3a35"/>
        <stop offset="1" stop-color="#b52624"/>
      </linearGradient>
    </defs>
  </svg>

  <!-- Flikarna längst ner. Ikonerna ritas här, namnen hörs i skärmläsare. -->
  <nav class="tabs">
    <button id="navHome" class="nav-btn" aria-label="Idag" title="Idag">
      <svg viewBox="0 0 32 32" fill="currentColor" aria-hidden="true">
        <defs><path id="navPaw" d="M-3.6 2a3.6 3 0 1 0 7.2 0a3.6 3 0 1 0-7.2 0ZM-5.6-1.6a1.4 1.4 0 1 0 2.8 0a1.4 1.4 0 1 0-2.8 0ZM-2.9-3.8a1.4 1.4 0 1 0 2.8 0a1.4 1.4 0 1 0-2.8 0ZM.1-3.8a1.4 1.4 0 1 0 2.8 0a1.4 1.4 0 1 0-2.8 0ZM2.8-1.6a1.4 1.4 0 1 0 2.8 0a1.4 1.4 0 1 0-2.8 0Z"/></defs>
        <use href="#navPaw" transform="translate(10.5 22) rotate(-8) scale(1.1)"/>
        <use href="#navPaw" transform="translate(21.5 10) rotate(8) scale(1.1)"/>
      </svg>
    </button>
    <button id="navTrain" class="nav-btn" aria-label="Träna" title="Träna">
      <svg viewBox="0 0 32 32" fill="currentColor" aria-hidden="true">
        <path d="M13 30.5c1.4-3 1.6-6 .9-10h4.2c-.7 4-.5 7 .9 10Z"/>
        <circle cx="16" cy="7.5" r="5.5"/>
        <circle cx="9" cy="9.5" r="5"/>
        <circle cx="23" cy="9.5" r="5"/>
        <circle cx="5.5" cy="16" r="4.5"/>
        <circle cx="26.5" cy="16" r="4.5"/>
        <circle cx="11.5" cy="17" r="5.5"/>
        <circle cx="20.5" cy="17" r="5.5"/>
        <circle cx="16" cy="12.5" r="5.5"/>
      </svg>
    </button>
    <button id="navLevels" class="nav-btn" aria-label="Navigering" title="Navigering">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" aria-hidden="true">
        <circle cx="13.5" cy="13.5" r="9"/>
        <path d="M20.5 20.5 28 28"/>
      </svg>
    </button>
    <button id="navDash" class="nav-btn" aria-label="Framsteg" title="Framsteg">
      <svg viewBox="0 0 32 32" fill="currentColor" aria-hidden="true">
        <path d="M4 10l6.5 5.5L16 5l5.5 10.5L28 10l-2.5 13h-19Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        <rect x="6" y="25" width="20" height="3" rx="1.5"/>
      </svg>
    </button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
